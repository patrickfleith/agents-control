name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for file in install.sh bin/agents-control lib/context.sh lib/install.sh tests/test-install.sh; do
            sh -n "$file"
          done
      - name: Personal skills
        run: ./bin/agents-control doctor --skills-only
      - name: Private workflow behavior
        run: sh tests/test-install.sh

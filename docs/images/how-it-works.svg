<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="title desc">
  <title id="title">How agents-control carries notes between sessions</title>
  <desc id="desc">On Monday you tell Claude Code a decision and a next step. The agent writes them into your private notes folder. On Tuesday, Codex reads the same notes and continues. The notes folder is excluded from Git, so the shared repository only receives code.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .box{fill:#f6f8fa;stroke:#d0d7de}
    .notes{fill:#ffffff;stroke:#1f2328}
    .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{fill:#57606a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .line{stroke:#1f2328;stroke-width:1.5;fill:none}
    .dash{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
    .head{fill:#1f2328}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .box{fill:#161b22;stroke:#30363d}
      .notes{fill:#0d1117;stroke:#e6edf3}
      .t{fill:#e6edf3}
      .m{fill:#8d96a0}
      .line{stroke:#e6edf3}
      .dash{stroke:#6e7681}
      .head{fill:#e6edf3}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="898" height="358" rx="12"/>

  <!-- Monday -->
  <rect class="box" x="32" y="55" width="240" height="110" rx="8"/>
  <text class="t" x="52" y="86" font-size="16" font-weight="600">Monday, Claude Code</text>
  <text class="m" x="52" y="116" font-size="14">You: “We chose SQLite.</text>
  <text class="m" x="52" y="138" font-size="14">Next, add retries.”</text>

  <path class="line" d="M274 110 H322" marker-end="url(#a)"/>
  <text class="m" x="279" y="100" font-size="13">writes</text>

  <!-- Notes -->
  <rect class="notes" x="330" y="30" width="240" height="160" rx="8" stroke-width="1.5"/>
  <text class="t" x="352" y="64" font-size="17" font-weight="600">Your notes</text>
  <text class="m mono" x="352" y="86" font-size="12">docs-agents-private/</text>
  <text class="t" x="352" y="120" font-size="14">Goals</text>
  <text class="t" x="352" y="144" font-size="14">Decisions</text>
  <text class="t" x="352" y="168" font-size="14">Next steps</text>

  <path class="line" d="M572 110 H620" marker-end="url(#a)"/>
  <text class="m" x="580" y="100" font-size="13">reads</text>

  <!-- Tuesday -->
  <rect class="box" x="628" y="55" width="240" height="110" rx="8"/>
  <text class="t" x="648" y="86" font-size="16" font-weight="600">Tuesday, Codex</text>
  <text class="m" x="648" y="116" font-size="14">Knows you chose SQLite.</text>
  <text class="m" x="648" y="138" font-size="14">Starts on the retries.</text>

  <!-- Git boundary -->
  <path class="dash" d="M450 192 V258"/>
  <text class="m" x="462" y="230" font-size="13">not shared: Git ignores this folder</text>

  <rect class="box" x="32" y="262" width="836" height="70" rx="8"/>
  <text class="t" x="52" y="292" font-size="16" font-weight="600">Shared repository</text>
  <text class="m" x="52" y="316" font-size="14">Your teammates see your code. Your notes stay on your computer.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="title desc">
  <title id="title">How agents-control organizes work with coding agents</title>
  <desc id="desc">You set goals, make decisions and review the work. These go into your project notes: goals, decisions, tasks, ideas and questions. Your agents, such as Claude Code, Codex and Cursor, read the notes to follow the plan and update them with what changed. Your code goes into commits. Git ignores your notes folder by default.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .box{fill:#f6f8fa;stroke:#d0d7de}
    .notes{fill:#ffffff;stroke:#1f2328}
    .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{fill:#57606a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .line{stroke:#1f2328;stroke-width:1.5;fill:none}
    .dash{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
    .head{fill:#1f2328}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .box{fill:#161b22;stroke:#30363d}
      .notes{fill:#0d1117;stroke:#e6edf3}
      .t{fill:#e6edf3}
      .m{fill:#8d96a0}
      .line{stroke:#e6edf3}
      .dash{stroke:#6e7681}
      .head{fill:#e6edf3}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="898" height="358" rx="12"/>

  <!-- You -->
  <rect class="box" x="32" y="45" width="220" height="140" rx="8"/>
  <text class="t" x="52" y="78" font-size="16" font-weight="600">You</text>
  <text class="m" x="52" y="110" font-size="14">Set the goals</text>
  <text class="m" x="52" y="134" font-size="14">Make the decisions</text>
  <text class="m" x="52" y="158" font-size="14">Review the work</text>

  <path class="line" d="M254 115 H332" marker-end="url(#a)"/>
  <text class="m" x="270" y="105" font-size="13">decide</text>

  <!-- Notes -->
  <rect class="notes" x="340" y="30" width="220" height="170" rx="8" stroke-width="1.5"/>
  <text class="t" x="360" y="62" font-size="17" font-weight="600">Project notes</text>
  <text class="m" x="360" y="84" font-size="13">Plain Markdown files</text>
  <text class="t" x="360" y="114" font-size="14">Goals</text>
  <text class="t" x="360" y="136" font-size="14">Decisions</text>
  <text class="t" x="360" y="158" font-size="14">Tasks</text>
  <text class="t" x="360" y="180" font-size="14">Ideas and questions</text>

  <path class="line" d="M562 95 H640" marker-end="url(#a)"/>
  <text class="m" x="578" y="85" font-size="13">guide</text>
  <path class="line" d="M640 140 H568" marker-end="url(#a)"/>
  <text class="m" x="574" y="160" font-size="13">update</text>

  <!-- Agents -->
  <rect class="box" x="648" y="45" width="220" height="140" rx="8"/>
  <text class="t" x="668" y="78" font-size="16" font-weight="600">Your agents</text>
  <text class="m" x="668" y="100" font-size="13">Claude Code, Codex, Cursor</text>
  <text class="m" x="668" y="134" font-size="14">Follow the plan</text>
  <text class="m" x="668" y="158" font-size="14">Record what changed</text>

  <!-- Git boundary -->
  <text class="m" x="450" y="222" font-size="13" text-anchor="middle">Your notes folder is ignored by Git.</text>

  <rect class="box" x="32" y="262" width="836" height="70" rx="8"/>
  <text class="t" x="52" y="292" font-size="16" font-weight="600">Files you commit</text>
  <text class="m" x="52" y="316" font-size="14">Your code goes into commits. Git ignores your notes folder by default.</text>
</svg>
